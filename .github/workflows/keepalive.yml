name: Keep FalkorDB awake

on:
  schedule:
    - cron: "17 */4 * * *"
    - cron: "45 17 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query FalkorDB through the live app
        run: |
          for attempt in 1 2 3; do
            if curl -fsS --max-time 60 https://regultrace.vercel.app/api/health; then exit 0; fi
            echo "Attempt $attempt failed, retrying in 30 seconds"
            sleep 30
          done
          exit 1

      - name: Check RBI for new regulations
        if: github.event.schedule == '45 17 * * *' || github.event_name == 'workflow_dispatch'
        run: curl -fsS --max-time 120 https://regultrace.vercel.app/api/cron/check
